# SUPLA Cloud. Certificate paths are prepared by init-supla in /run/supla.
ServerName supla
ServerTokens Prod
ServerSignature Off
ErrorLog /dev/stderr
LogLevel warn

<Directory /var/www/cloud/public>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

<VirtualHost *:80>
    DocumentRoot /var/www/cloud/public
</VirtualHost>

<VirtualHost *:443>
    DocumentRoot /var/www/cloud/public
    SSLEngine on
    SSLCertificateFile    /run/supla/cloud.crt
    SSLCertificateKeyFile /run/supla/cloud.key
</VirtualHost>
